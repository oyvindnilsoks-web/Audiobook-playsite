<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lydbøker</title>
<style>
  :root { --bg:#14161a; --card:#1e2126; --fg:#eceff4; --muted:#9aa3b2; --accent:#6aa9ff; }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f4f5f7; --card:#fff; --fg:#1b1f24; --muted:#5b6573; --accent:#1a63d6; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.4 system-ui,sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width:640px; margin:0 auto; padding:16px; }
  h1 { font-size:1.5rem; margin:8px 0 16px; }
  .card { background:var(--card); border-radius:12px; padding:14px 16px; margin:10px 0; display:block; color:inherit; text-decoration:none; }
  .card small, .muted { color:var(--muted); }
  a { color:var(--accent); }
  button, input { font:inherit; }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:10px 16px; cursor:pointer; }
  button.ghost { background:transparent; color:var(--accent); border:1px solid var(--accent); }
  input[type=password] { width:100%; padding:10px; border-radius:8px; border:1px solid var(--muted); background:var(--card); color:var(--fg); margin:8px 0; }
  .err { color:#e5484d; min-height:1.4em; }
  .bar { height:4px; background:var(--muted); border-radius:2px; margin-top:8px; opacity:.5; }
  .bar i { display:block; height:100%; background:var(--accent); border-radius:2px; }
  ol.chapters { list-style:none; padding:0; margin:12px 0; }
  ol.chapters li { padding:10px 12px; border-radius:8px; cursor:pointer; display:flex; justify-content:space-between; gap:8px; }
  ol.chapters li.active { background:var(--card); border-left:3px solid var(--accent); }
  audio { width:100%; margin:12px 0; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .hidden { display:none; }
</style>
</head>
<body>
<main>
  <section id="login" class="hidden">
    <h1>Lydbøker</h1>
    <form id="loginForm">
      <label for="pw">Passord</label>
      <input id="pw" type="password" autocomplete="current-password" autofocus>
      <div class="err" id="err"></div>
      <button type="submit">Logg inn</button>
    </form>
  </section>
  <section id="app" class="hidden"></section>
</main>
<script src="app.js"></script>
</body>
</html>
